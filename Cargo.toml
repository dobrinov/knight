[workspace]
resolver = "3"
members = ["crates/knight-hex", "crates/knight-core", "crates/knight-assets", "crates/knight-net", "crates/knight-engine", "apps/sandbox", "apps/relay"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
knight-hex = { path = "crates/knight-hex" }
knight-core = { path = "crates/knight-core" }
knight-assets = { path = "crates/knight-assets" }
knight-engine = { path = "crates/knight-engine" }
knight-net = { path = "crates/knight-net" }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
font8x8 = { version = "0.3", default-features = false }
log = "0.4"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
web-time = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
env_logger = "0.11"
js-sys = "0.3"
tungstenite = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
cpal = "0.18"
gilrs = "0.11"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[profile.web]
inherits = "release"
opt-level = "s"
