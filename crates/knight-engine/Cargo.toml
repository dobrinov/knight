[package]
name = "knight-engine"
description = "Knight Engine runtime: wgpu renderer, winit windowing and the app loop, for native and web."
version.workspace = true
edition.workspace = true

[features]
default = ["net"]
# Networking (`knight_engine::net`): relay client, WebSocket transports, lockstep. Off-line games
# can drop it to skip the WebSocket dependencies.
net = ["dep:knight-net"]

[dependencies]
knight-core.workspace = true
knight-net = { workspace = true, optional = true }
bytemuck.workspace = true
log.workspace = true
wgpu.workspace = true
winit.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
env_logger.workspace = true
cpal.workspace = true
gilrs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU where the browser has it, WebGL2 otherwise.
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration",
    "Navigator", "Location", "Gamepad", "GamepadButton", "GamepadMappingType",
    "AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "AudioScheduledSourceNode", "AudioNode", "AudioParam", "GainNode", "StereoPannerNode", "AudioDestinationNode",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
